<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Typing Practice Flashcards</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f0f8ff;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
        }

        .header {
            text-align: center;
            margin-bottom: 20px;
            color: #333;
        }

        .flashcard {
            background-color: white;
            border-radius: 15px;
            box-shadow: 0 8px 16px rgba(0,0,0,0.1);
            padding: 40px;
            text-align: center;
            width: 100%;
            max-width: 600px;
            margin-bottom: 30px;
            border: 4px solid #333;
        }

        .word-display {
            font-size: 4rem;
            letter-spacing: 5px;
            font-weight: bold;
            font-family: monospace;
            margin-bottom: 10px;
        }

        /* Base letter styles */
        .letter {
            transition: color 0.1s, background-color 0.1s;
            border-radius: 5px;
        }

        .row-top { color: #E53935; } /* Red for QWERTY row */
        .row-home { color: #4CAF50; } /* Green for ASDFG row */
        .row-bottom { color: #1E88E5; } /* Blue for ZXCVB row */

        .letter.typed { color: #e0e0e0; }
        .letter.error {
            color: #000;
            background-color: #ffcdd2;
        }

        .keyboard-container {
            max-width: 800px;
            width: 100%;
            border-radius: 10px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
            overflow: hidden; 
            margin: 0 auto; 
        }

        .keyboard-container img {
            width: 100%;
            height: auto;
            display: block;
            margin-top: -30%; 
        }

        .progress {
            font-size: 1.2rem;
            color: #666;
            margin-top: 10px;
        }

        #completion-message {
            display: none;
            color: #4CAF50;
            font-size: 2rem;
            font-weight: bold;
            margin-top: 20px;
        }

        /* --- NEW STYLES FOR THE EDITOR --- */
        .edit-btn {
            margin-top: 20px;
            padding: 8px 16px;
            background-color: #ddd;
            color: #555;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 0.9rem;
        }

        .edit-btn:hover {
            background-color: #ccc;
        }

        .modal-overlay {
            display: none;
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.6);
            align-items: center;
            justify-content: center;
            z-index: 1000;
        }

        .editor-modal {
            background: white;
            padding: 30px;
            border-radius: 10px;
            width: 90%;
            max-width: 400px;
            text-align: center;
        }

        .editor-modal h2 { margin-top: 0; }
        
        .editor-modal textarea {
            width: 100%;
            height: 200px;
            margin-bottom: 15px;
            padding: 10px;
            font-size: 1rem;
            border: 2px solid #ccc;
            border-radius: 5px;
            box-sizing: border-box;
            resize: vertical;
        }

        .modal-buttons {
            display: flex;
            justify-content: space-between;
            gap: 10px;
        }

        .btn-save { background: #4CAF50; color: white; border: none; padding: 10px; border-radius: 5px; cursor: pointer; flex: 1; }
        .btn-cancel { background: #E53935; color: white; border: none; padding: 10px; border-radius: 5px; cursor: pointer; flex: 1; }
        .btn-reset { background: #1E88E5; color: white; border: none; padding: 10px; border-radius: 5px; cursor: pointer; flex: 1; }
    </style>
</head>
<body>

    <div class="header">
        <h1>Shavuot Typing Practice</h1>
        <p>Type the word on the flashcard. Look closely at the letter colors to find the right row!</p>
    </div>

    <div class="flashcard">
        <div class="word-display" id="word-display"></div>
        <div class="progress" id="progress">Card 1 of X</div>
        <div id="completion-message">🎉 Great Job! You finished all the words! 🎉</div>
    </div>

    <div class="keyboard-container">
        <img src="https://www.k5technologycurriculum.com/wp-content/uploads/h5p/content/587/images/image-5d1bc63b745ee.PNG" alt="Color Coded Keyboard Reference">
    </div>

    <!-- Edit Button -->
    <button class="edit-btn" onclick="checkPassword()">⚙️ Edit Words</button>

    <!-- Editor Modal (Hidden by default) -->
    <div class="modal-overlay" id="editor-modal-overlay">
        <div class="editor-modal">
            <h2>Edit Words</h2>
            <p style="font-size: 0.9rem; color: #666;">Put one word per line. Case sensitive!</p>
            <textarea id="words-input"></textarea>
            <div class="modal-buttons">
                <button class="btn-cancel" onclick="closeEditor()">Cancel</button>
                <button class="btn-reset" onclick="resetToDefault()">Reset Default</button>
                <button class="btn-save" onclick="saveWords()">Save</button>
            </div>
        </div>
    </div>

    <!-- Link to default words -->
    <script src="words.js"></script>

    <!-- Main Game Logic -->
    <script>
        let wordList = [];
        let currentWordIndex = 0;
        let currentLetterIndex = 0;

        const wordDisplay = document.getElementById('word-display');
        const progressDisplay = document.getElementById('progress');
        const completionMessage = document.getElementById('completion-message');

        // --- NEW: Load words from browser memory or default list ---
        function initializeWords() {
            const savedWords = localStorage.getItem('customTypingWords');
            if (savedWords) {
                wordList = JSON.parse(savedWords);
            } else {
                // If nothing is saved locally, use the defaultWordList from words.js
                wordList = [...defaultWordList]; 
            }
        }

        // --- NEW: Password and Editor Functions ---
        function checkPassword() {
            const pwd = prompt("Enter the teacher password to edit words:");
            if (pwd === "Imma is the best") {
                openEditor();
            } else if (pwd !== null) {
                alert("Incorrect password!");
            }
        }

        function openEditor() {
            const overlay = document.getElementById('editor-modal-overlay');
            const textarea = document.getElementById('words-input');
            
            // Put current words in the text box, separated by line breaks
            textarea.value = wordList.join('\n');
            overlay.style.display = 'flex'; // Show modal
        }

        function closeEditor() {
            document.getElementById('editor-modal-overlay').style.display = 'none';
        }

        function saveWords() {
            const textarea = document.getElementById('words-input');
            // Split by lines, remove empty spaces, and remove empty lines
            const newWords = textarea.value.split('\n').map(word => word.trim()).filter(word => word.length > 0);
            
            if (newWords.length === 0) {
                alert("You need at least one word!");
                return;
            }

            // Save to browser memory
            localStorage.setItem('customTypingWords', JSON.stringify(newWords));
            
            closeEditor();
            restartGame();
        }

        function resetToDefault() {
            // Delete custom words from browser memory
            localStorage.removeItem('customTypingWords');
            closeEditor();
            restartGame();
        }

        function restartGame() {
            initializeWords();
            currentWordIndex = 0;
            currentLetterIndex = 0;
            wordDisplay.style.display = 'block';
            progressDisplay.style.display = 'block';
            completionMessage.style.display = 'none';
            loadWord();
        }

        // --- ORIGINAL GAME LOGIC ---
        function getKeyboardRowClass(char) {
            const topRow = "qwertyuiop";
            const homeRow = "asdfghjkl";
            const bottomRow = "zxcvbnm";
            const lowerChar = char.toLowerCase();

            if (topRow.includes(lowerChar)) return 'row-top';
            if (homeRow.includes(lowerChar)) return 'row-home';
            if (bottomRow.includes(lowerChar)) return 'row-bottom';
            return ''; 
        }

        function loadWord() {
            if (currentWordIndex >= wordList.length) {
                wordDisplay.style.display = 'none';
                progressDisplay.style.display = 'none';
                completionMessage.style.display = 'block';
                return;
            }

            const word = wordList[currentWordIndex];
            currentLetterIndex = 0;
            wordDisplay.innerHTML = ''; 

            for (let i = 0; i < word.length; i++) {
                const char = word[i];
                const span = document.createElement('span');
                span.innerHTML = char === ' ' ? '&nbsp;' : char; 
                span.classList.add('letter');
                
                const rowClass = getKeyboardRowClass(char);
                if (rowClass) span.classList.add(rowClass);

                span.id = `letter-${i}`;
                wordDisplay.appendChild(span);
            }

            progressDisplay.innerText = `Card ${currentWordIndex + 1} of ${wordList.length}`;
        }

        window.addEventListener('keydown', function(event) {
            if (document.getElementById('editor-modal-overlay').style.display === 'flex') {
                return; // Do nothing if the editor window is open
            }

            if (event.ctrlKey || event.altKey || event.metaKey || event.key === "Shift") return;
            if(event.code === 'Space') event.preventDefault();
            if (currentWordIndex >= wordList.length) return;

            const word = wordList[currentWordIndex]; 
            const expectedLetter = word[currentLetterIndex]; 
            const typedKey = event.key; 

            const currentSpan = document.getElementById(`letter-${currentLetterIndex}`);

            if (typedKey === expectedLetter) {
                currentSpan.className = 'letter typed'; 
                currentLetterIndex++;

                if (currentLetterIndex >= word.length) {
                    currentWordIndex++;
                    setTimeout(loadWord, 400); 
                }
            } else if (typedKey.length === 1 && typedKey.match(/[a-z0-9\s]/i)) {
                currentSpan.classList.add('error');
                setTimeout(() => currentSpan.classList.remove('error'), 300);
            }
        });

        // Initialize lists and start the game!
        initializeWords();
        loadWord();
    </script>
</body>
</html>
